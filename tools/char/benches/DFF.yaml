cell: DFF
source: JTL
load: JTL
bias_frac: 1.0
timestep_ps: 0.025
length_ps: 1200
inputs:
  a: [100, 500]
  clk: [200, 350, 650]
anchor_fs: 200000
lead_fs: 50000
resolution_fs: 10
windows:
  # Data before clock. Pass: one q after the first clk. Extra input switches do not fail.
  - name: t_setup
    lo_fs: -100000
    hi_fs: 200000
    stimulus:
      a: ["anchor"]
      clk: ["anchor + offset"]
    arrive:
      - {port: a, n: 1}
      - {port: clk, n: 1}
    pass:
      - {kind: count, port: q, n: 1}
      - {kind: after, port: q, ref: clk, ref_index: 0}
    measure: {kind: gap, later: clk, earlier: a}
  # Data after clock. Pass: two q, the first before the second a and the second after it.
  - name: t_hold
    lo_fs: -100000
    hi_fs: 200000
    stimulus:
      a: ["anchor", "anchor + lead + offset"]
      clk: ["anchor + lead", "anchor + lead + offset + lead"]
    arrive:
      - {port: a, n: 1}
      - {port: clk, n: 1}
    pass:
      - {kind: count, port: q, n: 2}
      - {kind: before, port: q, index: 0, ref: a, ref_index: 1}
      - {kind: after, port: q, index: 1, ref: a, ref_index: 1}
    measure: {kind: gap, later: a, earlier: clk, later_index: 1, earlier_index: 0}
  # Two read cycles, data-to-data separation offset, each a leading its clk by lead.
  - name: dt_min
    lo_fs: 56000
    hi_fs: 400000
    stimulus:
      a: ["anchor", "anchor + offset"]
      clk: ["anchor + lead", "anchor + offset + lead"]
    pass:
      - {kind: count, port: a, n: 2}
      - {kind: count, port: clk, n: 2}
      - {kind: count, port: q, n: 2}
      - {kind: paired, port: q, ref: clk}
      - {kind: before, port: q, index: 0, ref: a, ref_index: 1}
