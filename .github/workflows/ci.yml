name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest and hypothesis
        run: pip install pytest hypothesis ./tools/char

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: wasm-pack
        run: wasm-pack build crates/fx-wasm

      - name: pytest
        run: pytest tools/char

      - name: Install PyLSE oracle
        run: |
          git clone --branch pldi-2022 --depth 1 https://github.com/UCSBarchlab/PyLSE.git third_party/pylse
          pip install -e third_party/pylse/third-party/pyuppaal
          pip install -e third_party/pylse
          pip install ./tools/oracle

      - name: pytest oracle
        run: pytest tools/oracle

      - name: golden manifest
        run: python scripts/check_manifest.py

  event-log-hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build fx-cli
        run: cargo build -p fx-cli

      - name: Event-log hashes
        run: python scripts/event_hashes.py
