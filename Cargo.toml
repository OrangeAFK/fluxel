[workspace]
resolver = "3"
members = [
    "crates/fx-time",
    "crates/fx-ir",
    "crates/fx-kernel",
    "crates/fx-analog",
    "crates/fx-families",
    "crates/fx-sta",
    "crates/fx-stat",
    "crates/fx-flow",
    "crates/fx-world",
    "crates/fx-cli",
    "crates/fx-wasm",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["derive"] }
proptest = "1"
