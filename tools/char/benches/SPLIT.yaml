cell: SPLIT
source: JTL
load: JTL
bias_frac: 1.0
timestep_ps: 0.025
length_ps: 1200
inputs:
  a: [100, 300]
anchor_fs: 200000
lead_fs: 50000
resolution_fs: 10
windows:
  # Two pulses on a. Pass: q0 and q1 each fire twice, inside their input gaps.
  - name: dt_min
    lo_fs: 6000
    hi_fs: 400000
    stimulus:
      a: ["anchor", "anchor + offset"]
    pass:
      - {kind: count, port: a, n: 2}
      - {kind: count, port: q0, n: 2}
      - {kind: count, port: q1, n: 2}
      - {kind: paired, port: q0, ref: a}
      - {kind: paired, port: q1, ref: a}
