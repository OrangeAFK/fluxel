[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxel-char"
version = "0.0.0"
description = "JoSIM characterization harness for Fluxel."
requires-python = ">=3.11"
dependencies = ["pyyaml", "pyarrow", "matplotlib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["char*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
